name: WinGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.2.0
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish to WinGet
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

    steps:
      - name: Check credentials
        if: env.WINGET_TOKEN == ''
        run: echo 'WINGET_TOKEN secret is not set; skipping WinGet publish.'

      - name: Submit a new version
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: stan220.CapsSwitch
          release-repository: stan220/CapsSwitch
          release-tag: ${{ inputs.version }}
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
