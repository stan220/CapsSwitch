name: Windows builds

on:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to test, for example v0.2.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - architecture: i686
            target: i686-pc-windows-msvc
            os: windows-latest
          - architecture: aarch64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $source = "target/${{ matrix.target }}/release"
          $package = "package"
          New-Item -ItemType Directory -Path $package
          Copy-Item "$source/caps-switch.exe" $package
          Copy-Item "$source/caps_switch_hook.dll" $package
          Copy-Item "config.toml" $package
          Copy-Item "README.md" $package
          Copy-Item "LICENSE" $package
          Compress-Archive -Path "$package/*" -DestinationPath "capsswitch-windows-${{ matrix.architecture }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: capsswitch-windows-${{ matrix.architecture }}
          path: capsswitch-windows-${{ matrix.architecture }}.zip

  functional:
    name: Functional tests (x64)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: capsswitch-windows-x86_64
          path: artifact

      - name: Run functional tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive artifact/capsswitch-windows-x86_64.zip -DestinationPath functional
          Copy-Item functional broken -Recurse
          Remove-Item broken/caps_switch_hook.dll

          $failedAsExpected = $false
          try {
            & tests/functional.ps1 -PackageDirectory broken
          }
          catch {
            $failedAsExpected = $true
            Write-Host "Negative control failed as expected: $($_.Exception.Message)"
          }
          if (-not $failedAsExpected) {
            throw 'The functional test did not detect a package without its hook DLL.'
          }

          & tests/functional.ps1 -PackageDirectory functional

  release:
    name: Publish release
    needs: [build, functional]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: capsswitch-windows-*
          path: dist
          merge-multiple: true

      - name: Create release or replace its archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*.zip
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "CapsSwitch ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              dist/*.zip
          fi

  package-test:
    name: ${{ matrix.manager }} installation
    needs: release
    if: >-
      always() &&
      ((startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs['release-tag'] != ''))
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        manager: [WinGet, Chocolatey]
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs['release-tag'] }}

    steps:
      - uses: actions/checkout@v6

      - name: Install with WinGet
        if: matrix.manager == 'WinGet'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          winget settings --enable LocalManifestFiles
          winget install --manifest "packaging/winget/$version" --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'WinGet installation failed.' }

      - name: Build and install the Chocolatey package
        if: matrix.manager == 'Chocolatey'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          New-Item -ItemType Directory -Force dl, dist | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --pattern 'capsswitch-windows-x86_64.zip' `
            --pattern 'capsswitch-windows-i686.zip' `
            --dir dl
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download release assets.' }

          $sum64 = (Get-FileHash dl/capsswitch-windows-x86_64.zip -Algorithm SHA256).Hash
          $sum32 = (Get-FileHash dl/capsswitch-windows-i686.zip -Algorithm SHA256).Hash
          Push-Location packaging/chocolatey
          foreach ($file in 'capsswitch.nuspec', 'tools/chocolateyinstall.ps1') {
            $content = (Get-Content $file -Raw).
              Replace('__VERSION__', $version).
              Replace('__CHECKSUM64__', $sum64).
              Replace('__CHECKSUM32__', $sum32)
            [IO.File]::WriteAllText((Resolve-Path $file), $content)
          }
          choco pack capsswitch.nuspec --output-directory "$env:GITHUB_WORKSPACE/dist"
          if ($LASTEXITCODE -ne 0) { throw 'choco pack failed.' }
          Pop-Location

          choco install capsswitch --version $version --source "$env:GITHUB_WORKSPACE/dist" --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey installation failed.' }

      - name: Test the installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.manager }}' -eq 'WinGet') {
            $command = Join-Path $env:LOCALAPPDATA 'Microsoft/WinGet/Links/caps-switch.exe'
            $target = (Get-Item $command -ErrorAction Stop).Target
            if (-not $target) { $target = $command }
            $packageDirectory = Split-Path -Parent $target
            Get-ChildItem $packageDirectory -File | ForEach-Object {
              $zone = Get-Content $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue
              if ($zone) { Write-Host "$($_.Name) Zone.Identifier: $zone" }
              Unblock-File $_.FullName
            }
          }
          else {
            $packageDirectory = Join-Path $env:ChocolateyInstall 'lib/capsswitch/tools'
          }
          & tests/functional.ps1 -PackageDirectory $packageDirectory

  chocolatey:
    name: Chocolatey
    needs: package-test
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/chocolatey.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      version: ${{ github.ref_name }}

  winget:
    name: WinGet
    needs: package-test
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/winget.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
