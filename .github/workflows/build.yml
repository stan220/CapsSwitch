name: Windows builds

on:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - architecture: i686
            target: i686-pc-windows-msvc
            os: windows-latest
          - architecture: aarch64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $source = "target/${{ matrix.target }}/release"
          $package = "package"
          New-Item -ItemType Directory -Path $package
          Copy-Item "$source/caps-switch.exe" $package
          Copy-Item "$source/caps_switch_hook.dll" $package
          Copy-Item "config.toml" $package
          Copy-Item "README.md" $package
          Copy-Item "LICENSE" $package
          Compress-Archive -Path "$package/*" -DestinationPath "capsswitch-windows-${{ matrix.architecture }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: capsswitch-windows-${{ matrix.architecture }}
          path: capsswitch-windows-${{ matrix.architecture }}.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: capsswitch-windows-*
          path: dist
          merge-multiple: true

      - name: Create release or replace its archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*.zip
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "CapsSwitch ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              dist/*.zip
          fi

  chocolatey:
    name: Chocolatey
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/chocolatey.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      version: ${{ github.ref_name }}

  winget:
    name: WinGet
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/winget.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
