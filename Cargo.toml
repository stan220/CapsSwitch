[package]
name = "caps-switch"
version = "0.1.1"
edition = "2021"
description = "Switch Windows input language with CapsLock and show an animated language indicator"
license = "MIT"
repository = "https://github.com/stan220/CapsSwitch"

[lib]
name = "caps_switch_hook"
path = "src/hook.rs"
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
